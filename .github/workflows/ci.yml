name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（server + web）
        run: npm run check

      - name: 单元与接口测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      # 说明：npm run smoke 需要本机 Chrome 与 CDP，且依赖构建产物，
      # 在 CI 里不稳定，因此留作本地提交前自检，不进流水线。
